name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "KEY_PATH=$RUNNER_TEMP/release.jks"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "ALIAS_NAME=$ALIAS_NAME"
            echo "ALIAS_PASSWORD=$ALIAS_PASSWORD"
          } > local.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee apk-certs.txt
          grep -q "CN=PianoEthan" apk-certs.txt

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          version=$("$aapt2" dump badging app/build/outputs/apk/release/app-release.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "APK versionName=$version, tag=$GITHUB_REF_NAME"
          [ "v$version" = "$GITHUB_REF_NAME" ]

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
